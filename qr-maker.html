<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background:#fff; color:#222; max-width:720px; margin:0 auto; padding:20px; }
  h1 { font-size:1.4rem; margin-bottom:8px; }
  input { width:100%; padding:12px; font-size:1rem; border:1px solid #bbb; border-radius:8px; margin:8px 0 14px; }
  button { padding:12px 22px; font-size:1rem; border:none; border-radius:8px; background:#ff4d79; color:#fff; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:22px; margin-top:24px; }
  .item { text-align:center; border:1px solid #eee; border-radius:12px; padding:14px; }
  .item h3 { margin-bottom:10px; }
  .item small { display:block; word-break:break-all; color:#777; margin-top:8px; font-size:.7rem; }
  .item a { display:inline-block; margin-top:8px; font-size:.9rem; }
  .qr { display:flex; justify-content:center; }
</style>
</head>
<body>
<h1>QR code maker (5 codes)</h1>
<p>Paste the full link of your hunt page (the one that ends with <b>hunt.html</b>):</p>
<input id="base" placeholder="https://YOUR-USERNAME.github.io/YOUR-REPO/hunt.html">
<button onclick="make()">Make the 5 QR codes</button>
<div class="grid" id="grid"></div>

<script>
const TOKENS = ["rose","moon","star","key","heart"];
function make(){
  let base = document.getElementById('base').value.trim();
  if(!base){ alert('Paste your link first'); return; }
  base = base.split('?')[0];
  const grid = document.getElementById('grid'); grid.innerHTML='';
  TOKENS.forEach((t,i)=>{
    const url = base + '?k=' + t;
    const box = document.createElement('div'); box.className='item';
    box.innerHTML = '<h3>QR ' + (i+1) + '</h3><div class="qr"></div><small>' + url + '</small>';
    grid.appendChild(box);
    new QRCode(box.querySelector('.qr'), { text:url, width:180, height:180, correctLevel:QRCode.CorrectLevel.M });
    setTimeout(()=>{
      const c = box.querySelector('canvas');
      if(c){ const a=document.createElement('a'); a.textContent='Download PNG'; a.download='QR-'+(i+1)+'.png'; a.href=c.toDataURL('image/png'); box.appendChild(a); }
    }, 150);
  });
}
</script>
</body>
</html>
